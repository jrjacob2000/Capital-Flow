name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package versions for public npm registry
        run: |
          rm -f bun.lock package-lock.json
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const publicVersions = {
              "@google/genai": "^1.0.0",
              "@tailwindcss/vite": "^4.0.9",
              "@vitejs/plugin-react": "^4.3.4",
              "firebase": "^11.4.0",
              "lucide-react": "^0.475.0",
              "motion": "^12.4.7",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "vite": "^6.2.0",
              "@types/node": "^22.13.5",
              "@types/react": "^19.0.10",
              "@types/react-dom": "^19.0.4",
              "tailwindcss": "^4.0.9",
              "typescript": "^5.8.2"
            };
            for (const [k, v] of Object.entries(publicVersions)) {
              if (pkg.dependencies && pkg.dependencies[k]) pkg.dependencies[k] = v;
              if (pkg.devDependencies && pkg.devDependencies[k]) pkg.devDependencies[k] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
